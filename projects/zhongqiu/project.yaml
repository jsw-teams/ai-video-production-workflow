    portrayal: 口述记忆只归属采访者；不复刻其身份肖像。

structure:
  - section: 声音先于日期（0–0:24）
    purpose: 用相反的地方动作建立谜面，暂不说节日定义。
  - section: 这个日期怎样落在秋天（0:24–1:03）
    purpose: 清楚说明农历八月十五、秋季与公历浮动，避免“每年就是同一个公历日”。
  - section: 节日不是某日发明（1:03–1:40）
    purpose: 用少量历法/文献细节说明赏月、秋祀和都市节庆长期叠加；不把神话当史实。
  - section: 让习俗变成动作（1:40–2:52）
    purpose: 博饼、火龙和烤肉分别呈现机会游戏、集体表演和现代商业/休闲扩散。
  - section: 食物进入城市与迁移（2:52–3:58）
    purpose: 苏州现烤月饼、礼盒/零售、海外工作日和社区记忆展示传统如何改写。
  - section: 第二天还在吃（3:58–4:30）
    purpose: 回到一户日常早餐，用余下食物让“每一代重做传统”成为具体行为。

shots:
  - id: opening_dice
    time: 0:00–0:04
    action: 六枚骰子落入瓷碗，弹两次停住；镜头不先展示完整人物。
    motion: 真人手部动作或高保真 I2V，骰子接触和停顿必须明确。
    sound: dice_porcelain Foley 为前景；音乐只留一次低木音。
  - id: opening_fire_dragon
    time: 0:04–0:08
    action: 多人肩抬火龙过街，香火烟和人群转身随龙移动。
    motion: 稳定横移跟拍，搬运者步伐一致但不军阵化。
    sound: 搬运脚步、观众后退、火龙摩擦与人声远近变化。
  - id: opening_grill
    time: 0:08–0:12
    action: 一家人轮流翻动食物，烟遮住镜头后接到烤炉近景。
    motion: 手臂、烤夹和烟同步，保留一次食物翻面接触。
    sound: 真正烤架/食物 Foley 优先，音乐退后。
  - id: opening_pastry
    time: 0:12–0:16
    action: 苏式鲜肉月饼刚出炉，师傅夹起，一名顾客掰开酥皮。
    motion: 手和热气连续，酥屑落到纸袋。
    sound: 烤炉门、夹具、脆酥断裂声。
  - id: opening_lantern
    time: 0:16–0:20
    action: 新加坡社区灯展/儿童提灯穿过摊位人流，镜头贴着灯笼的摆动。
    motion: 儿童步态和灯笼摆动分开，有清晰空间深度。
    sound: 纸灯轻晃、街市、远处现场活动。
  - id: opening_commute
    time: 0:20–0:24
    action: 海外下班者在普通厨房切开一小块月饼，外套仍搭在椅背。
    motion: 开袋、放刀、切开和抬眼一气呵成。
    sound: 纸盒、刀、房间声；音乐落下主节奏。
  - id: calendar
    time: 0:24–1:03
    action: 手翻过农历月份，八月十五对应不同公历日期；夜空用实拍月相/纸片叠印呈现。
    motion: 纸页与笔迹手工变化，日期由后期制作。
    sound: 纸张翻动、铅笔划线、稀疏旁白。
  - id: historical_context
    time: 1:03–1:40
    action: 历法、秋季谷物和城市赏月文献互相叠入桌面，不出现神话拟历史表演。
    motion: 真实纸张翻页、档案图像/文字由剪辑叠加。
    sound: 页面、秋风与轻微市场底噪。
  - id: bobing
    time: 1:40–2:04
    action: 不同年龄的手轮流掷骰、认点、取饼并把奖品推回共桌。
    motion: 四段 action beats；骰子结果要读得清楚。
    sound: 瓷碗骰子单独拟音，笑声不盖过规则说明。
  - id: fire_dragon
    time: 2:04–2:28
    action: 社区成员搬龙、穿香、起龙、过弯、放低肩膀休息。
    motion: 关键弯道以真人 motion reference 与连续 I2V/V2V 控制；失败则拆镜，不用静帧代替。
    sound: 香枝、布面、脚步、街巷回声。
  - id: taiwan_bbq
    time: 2:28–2:52
    action: 住家骑楼/街边烤架点起，家庭成员安排座位、烤肉、端菜。
    motion: 从搬炉、点火、摆座到入席形成完整动作链。
    sound: 炭火、夹具、邻里声；不得用正弦波替代。
  - id: suzhou_market
    time: 2:52–3:24
    action: 面团起酥、包馅、烤制、取饼；顾客从买菜路线停下买一袋。
    motion: 手部近景与完整市场走动双景，不把烘焙压成说明字幕。
    sound: 擀面、包纸、炉门、排队人群。
  - id: migration
    time: 3:24–3:58
    action: 移民长者记忆与城市社区活动并置；用手、桌面和灯笼建立记忆，不模拟受访者肖像。
    motion: 真实社区可授权素材或演员重构；明确情境重构。
    sound: 原创短对白/旁白，室内外空间音渐变。
  - id: next_morning
    time: 3:58–4:30
    action: 第二天早餐，剩下的月饼被切开、装进通勤袋；一个人发消息问朋友是否留下一块。
    motion: 从桌面到门口完成动作，人物有听/看/回应。
    sound: 刀、纸袋、清晨住宅底噪；音乐仅留开场木音动机。

motion:
