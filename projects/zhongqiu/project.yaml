    - asset: lunar_date_anchor
      target_seconds: 3
      action: show the verified calendar anchor “农历八月十五” as an in-world paper note across the street-to-home transition; no explanatory title card
  narration_in_poc: none
  poc_test: >-
    20–25 秒必须同时看到火龙多人协作绕过街角的连续动作和家庭切分、递接月饼的完整动作。全段检验统一纸本水彩线条、身体连续性与重量、环境转换、落步/切酥皮的同步 Foley、生活空间声、动作节奏与音乐的让位关系；即使无旁白也能理解街上舞火龙、家中分月饼都发生在农历八月十五。
  character_performance: >-
    先定角色与声线，再按真实对话音频标注简化 viseme；台词避免正面长讲，优先看手、听者反应和身体重心。
  action_beats: [准备, 启动, 接触, 结果, 反应, 余韵]
  control_choice: >-
    人物日常表演优先短段原生视频生成或 I2V/V2V 并固定角色参考；骰子、烤夹、火龙搬运若接触/重量错误导致镜头失义，采用真人动作参考、分解镜头或 3D blocking 控制。
  continuity: 纸纹、服装、光线和物件大小跨镜一致；不以重复单张底图轻推充当人物动画。

sound:
  tracks: [dialogue_or_voiceover, sync_foley, ambience, event_sound, music]
  dialogue_or_voiceover: >-
    一位清楚、克制的中文叙述声；仅在日期、形成脉络和证据边界处说话。若重构人物发言，标为原创台词，不冒充受访者。
  foley_by_scene:
    dice: 六枚真实骰子撞瓷碗、滚动、停住。
    fire_dragon: 步伐、衣料/龙身、香火、街巷人群。
    barbecue: 点火、夹具、食物翻面、油滴与邻里声。
    mooncake: 烤炉、夹取、酥皮断裂、纸袋与刀切。
  ambience: 厨房、市场、街巷和海外社区各自录制或合法采样，按空间剪辑。
  event_sound: 木模轻敲作为跨段动机；不模拟真实报道现场的口号或广播。
  mix_rule: 重要生活声、说明对白出现时音乐主动让位；分层保留对白、同步拟音、环境、活动声、音乐。
  prohibited: 所有 Foley 用正弦波/noise 伪造；同一套音效套全片。

