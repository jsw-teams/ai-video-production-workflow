project: zhongqiu
title: 一个月的月饼
status: complete
deliverable: final.mp4
format: 1920x1080, 24 fps, stereo
target_duration_seconds: 92

creative_plan:
  audience_hook: >-
    从节后的一口早餐开始：月饼为什么在普通工作日再次出现？旁白先埋下“一场中秋聚餐，之后一个月的早晚餐还是月饼”这个不太像节日祝词的尾声，再倒回那一晚。
  central_question: >-
    一顿节日聚会散场后，人们把什么带回了平常日子？
  author_thesis: >-
    这则家庭记忆最有力的部分不是一桌圆满的食物，而是食物留到下个月。节日劳动有余音：同一批月饼先是邻里共享，随后又占据日常餐桌。画面既保留那晚的热闹，也认真看见“做得太多”带来的后续。
  why_watch: >-
    无关中秋的观众也能看一则有明确反转的生活小故事：邻里把一顿饭做成了整整一个月的食物。搅拌、压模、送烤、围桌与早晨再切开同一块饼，连续动作本身带来节奏和细节。
  narrative_engine: >-
    工作量不断累积的烘焙过程，推动影片从夜前厨房到聚餐，再跨过节日边界进入一个月后的重复早餐。模具敲桌的三拍声贯穿这段时间。
  cases_or_subjects:
    - subject: 80 年代末哈尔滨一位小学女生的家庭中秋回忆，见《生活报》2006 年口述报道。
      people: 母亲、在食堂工作的舅妈、包馅的舅舅、邻居与孩子；按来源中该家庭回忆作匿名视觉重构，不补造人物履历。
      place_and_time: 哈尔滨，一户职工邻里在中秋前夕合做月饼并于中午聚餐；确切年份未知。
      physical_actions: 和面、分馅、借模、包馅、压模、磕出饼坯、装箱送食堂烤制、端菜、分食、收起剩余月饼、次月早餐再次切开。
      sensory_details: 一米大白瓷盆、油黑的借来模具、桌面三拍、烤箱热气、饼屑掉进纸盒、早餐瓷碗的勺声。
      evidence_boundary: 具体劳动分配与剩余月饼来自受访者个人叙述；片中台词和声线是原创重构。
  structure:
    - section: 早餐的尾声（0–10 秒）
      purpose: 先给反常的结果，不先讲节日知识；月饼进入平常餐桌。
    - section: 邻里开工（10–27 秒）
      purpose: 建立具体的家与时间；食材、盆、手和桌面动作逐一启动。
    - section: 压模接力（27–51 秒）
      purpose: 让声音和手势而非习俗字幕说明劳动如何被分担；完成动作 beats 与对白口型。
    - section: 聚餐（51–69 秒）
      purpose: 前段劳动终于成为多人共享的一餐；欢闹里看得见谁仍在端菜。
    - section: 做得太多（69–82 秒）
      purpose: 第一层转折；堆起的盒子使节日晚餐的时间继续伸长。
    - section: 一个月后（82–92 秒）
      purpose: 用第二次早餐作结；一块切开的月饼回应开场，模具三拍在留白中停下。
  turning_points:
    - opening_result: 节日的月饼先在节后早餐出现。
    - labor_reveal: 镜头看清完成一块饼需要多少双手与往返。
    - surplus: 聚会结束，剩余的月饼没有随节日结束。
    - change_of_scale: 一个月从一桌菜变成重复的早餐和晚餐。
  climax_hypothesis: >-
    烤箱送回一盘盘饼，镜头仍跟着送饼的手，却切到饭后桌底下装满的盒子；热闹没有立刻结束，反而在“太多了”这里变味。
  ending_logic: >-
    次月早餐里最后一块饼被孩子分成两半；不下总结字幕，声音停在熟悉的三拍上。影片结束在日常仍带着那一晚的具体证据之处。
  visual_language: >-
    16:9 纤维纸本水彩厨房、深褐色手绘线条与有限色彩人物。角色用稳定的头身比例和简洁的五类口型绘制，避免生成式脸部跳动。素材复核发现首张环境底图偏写实、人物像贴纸；重制水彩环境后，纸纹、线条和暖色范围更接近。时间主要通过动作和剪辑表达，不用月亮剪影填空。
  motion_strategy: >-
    场景环境由生成图建立空间氛围；人物以项目内绘制的矢量线稿逐帧/关键帧动画表演，保证时间连续。对白先用本地中文 TTS 制成声音文件，核对每句时长后标定闭口、开口、圆口、齿音口型；说话者侧身/背向拍摄，重要句切听者、食物或手部。压模动作逐项设准备、抬手、接触、出饼、反应、余韵，敲模 Foley 与接触帧同步。
  sound_world:
    dialogue: 两句短对白，由合成演员声演绎并标记为创作台词；另有一条中性叙述旁白，转述口述记录。
    sync_foley: 和面黏手、瓷盆推桌、模具抬起/磕下、纸盒摩擦、盘碟碰桌、刀切月饼、勺触碗；均按动作表单独对齐。
    ambience: 厨房房间音、楼道远声、食堂烤箱风扇、夜晚邻里底噪、节后清晨室内底噪。
    event_sound: 三拍模具声是叙事动机；烤箱门和回来的纸箱标记接力与后果。
    music: 木质敲击与轻拨弦/钢琴合成音乐；活动中段加层，超量处抽空，早餐只留开场音型的变奏。
  music_arc: >-
    74 BPM 轻木敲建立“手在做事”的脉冲；和面起持续低音，压模段加入两层拨弦形成接力；多人聚餐处织体最密但不踩每个切点；画面进入满盒余饼时音乐突然抽掉低频和节拍；早餐只留下开头三音与房间声，结尾留一拍空气。
  material_strategy:
    generate: 厨房/邻里空间的水彩背景与纸本质感候选；手绘角色姿势、表情和局部食物补充素材。
    build_by_code: 可控线条人物动作、口型时轴、字幕、几何道具，以及音画同步的剪辑结构。
    real_sources: 仅保留来源文字记录及链接用于事实核对；不把真实人物照片、采访声音或历史厨房照片冒充为本片素材。
  anti_cliches:
    - 不以满月、嫦娥、兔子灯和祝福词充当故事。
    - 不把一户受访者的经历概括成所有中国家庭的共同习俗。
    - 不将女性/男性的劳动分工写成受访者未表达的态度；以行动呈现。
    - 不以高速口型或正面讲述展示技术；表演重心是手、等待和听者反应。
  risks:
    - 有限动画若只让画面轻推，人物会退化成绘本；需确实呈现拿、递、压、端、坐、切的动作。
    - 过度甜美会隐藏“做太多”这个真实转折；中段需保留疲劳和满盒余量。
    - 合成中文对白可能不自然；控制台词长度，音乐给语句留出空隙。
  why_watch_test:
    label_removed: >-
      仍是一则“一个晚上生产出一个月余量”的家庭时间故事，劳动、分享与剩余三种关系本身可看。
    likely_30_second_exit: 如果开头先泛谈节日，或厨房动作是静止插画，陌生观众会离开。
    cliché_risk: 大月亮、笑脸全家福与“团圆真好”；主动用节后早餐和具体工作替代。
    climax_test: 高点是共享食物变成过量，发生意义变化，不是最亮的烤箱或最大声的乐句。
    ending_test: 最后一块月饼和三拍声扩展记忆，不复述主题。
  replanning_rule: >-
    完成约三分之一核心动画/声音草稿后停下审看：若压模手势不清楚、对白口型失真或余量没有第二层意义，先修改故事节拍和镜头，不继续批量加素材。

research:
  fact_scope: 只选一则地方报纸对个人家庭记忆的采访；片中不作中国家庭普遍性断言。
  verified_facts:
    - source: 2006 年《生活报》报道
      fact: 受访者韩莉回忆 80 年代末某次邻里中秋聚会，描述一米大白瓷盆、借来的模具、在食堂烤制，以及一个月早晚餐吃月饼。
    - source: 2006 年国家级非遗名录
      fact: 中秋节被列入第一批国家级非物质文化遗产名录；此背景不需要进入片中。
  source_opinions: 受访者说此后没有再过那样热闹忙碌的中秋；这是个人回忆。
  author_analysis: 食物的剩余把节日晚间的劳动带回日常时间。
  uncertainty: 报道没有给出聚会的确切年份；只使用“80 年代末”。台词属创作演绎。

cases:
  - id: harbin-neighbor-mooncakes
    source: sources.md#生活报记者采访不同年龄的人听他们讲述我的苦乐中秋
    portrayal: anonymous illustrated reconstruction of one published memory
    character_lines_are_original: true

structure:
  opening_voiceover: 一场中秋聚餐最久的余音，可能是一个月的早饭和晚饭。
  shot_count_target: 10
  action_beats:
    - beat: 分馅
      preparation: 两只手把馅团大小校准
      initiation: 舅舅把馅球放到面皮中央
      contact: 指腹收拢面皮
      result: 一盘饼坯排满
      reaction: 母亲移动空位
      afterglow: 桌面上只留一圈面粉
    - beat: 压模与敲出
      preparation: 手蘸粉、把模具转正
      initiation: 拇指压下
      contact: 木模落在桌面
      result: 饼坯从模具脱开
      reaction: 孩子探头查看花纹
      afterglow: 面粉被手掌擦开
    - beat: 次月早餐
      preparation: 打开纸盒
      initiation: 刀压进酥皮
      contact: 饼屑落到碗边
      result: 再次分成两半
      reaction: 勺停一下
      afterglow: 窗外日常的晨声继续

motion:
  authored_for: main line-animation performance; no frozen-art substitute
  viseme_set: closed, open-a, round-o, teeth-i, narrow-e
  body_performance: hands lead, head turn listens, torso shifts weight, blink/pause is held only when motivated by the line
  continuity: fixed clothes/hair/line weight/prop size across all cuts; mouths frame-accurate to final mix

sound:
  stems: [dialogue, voiceover, sync_foley, ambience, music]
  recorded_archive: none
  generated_voice_disclosure: synthetic performance, never presented as interview

music:
  composition: original code-synthesized score, wood tap motif and warm plucked tones
  cue_points_seconds: {start: 0, pulse: 10, handoff: 27, gathering: 51, overload_drop: 69, breakfast_return: 82, stop: 92}
  candidate_review: >-
    另生成 66 BPM 替代稿，与成片 74 BPM 版按六个音乐段落比较包络 RMS：74 BPM 为 -29.2/-23.3/-22.2/-21.1/-22.1/-22.7 dB，66 BPM 为 -30.0/-23.8/-22.7/-21.9/-22.8/-22.8 dB。选 74 BPM，让制作月饼的重复动作有前进感，同时保留 69 秒后的抽薄与早餐回归；66 BPM 变化较缓。音频试听能力不可用，因此这是结构与电平包络比较，不声称完成主观听审。

prompts:
  environment_image: "Empty late-1980s Harbin workers' apartment kitchen, large white porcelain basin on a worn wooden worktable, borrowed dark wooden pastry mold, paper trays, warm practical lamp, hand-painted watercolor on cream paper, quiet and observational, wide 16:9, no people, no readable text."
  character_reference: "Original anonymous Chinese family silhouettes for a limited hand-drawn animation; stable simple proportions, ink-brown line, muted watercolor fills, ordinary clothes, non-caricatured, side and three-quarter views, no celebrity or real-person likeness."

selected:
  - asset: assets/kitchen-scene.png
    role: main kitchen environment
    reason: >-
      秋叶、旧瓷盆、木模和相邻餐室保持在同一空间；覆盖为纸本水彩风格后，能与线条人物统一构图、纸纹和暖色关系。
rejected_reasons:
  - asset: initial kitchen candidate (not copied into project assets)
    reason: >-
      It showed snow, a radiator and distinctly European apartment details; the season and domestic space contradicted the reported late-summer/autumn gathering.
  - asset: first photorealistic kitchen plate (replaced at stable asset path)
    reason: >-
      关键帧复看时写实室内与矢量线条人物像两层贴纸；保留原有物件关系，把当前环境图重绘为纸本水彩。
material_review_replan: >-
  第一轮图像只有空厨房，没有人物；因此不批量生成节俗图片，而以明确案例和动作节拍自行绘制角色，先录台词再按音频安排口型。成片复看发现环境图偏写实，角色叠加感过强；保留厨房物件和构图，将环境重绘为纸本水彩并覆盖稳定路径。复核后线条、纸纹与色域更接近，人物身体仍是简洁矢量线稿，保留有限动画质地。餐室仍视作同一户人家的相邻空间。
qa:
  viewing_status: >-
    已检查全长每 8 秒审看片及说话口型、压模接触帧、月饼余量转折、次月早餐和片尾；视频解码无错误。
  facts: >-
    事实限定为《生活报》记录的一户哈尔滨家庭回忆；确切年份未载，旁白只说“80 年代末”。角色对白标为创作演绎，不冒充受访者原话。
  style_and_performance: >-
    环境已重绘为水彩纸本，线稿角色在镜头间保持服饰、头身和线宽；完整身体有眨眼、转头、抬手、接触、压模、递取动作。仍是简洁二维有限动画，人物填色比背景更平，不伪称真人级表演。
  lip_sync: >-
    合成对白先生成并按实际 WAV 时长定位：孩子句从 34.8 秒开始、约 2.25 秒；成人回答从 37.2 秒开始、约 3.25 秒。五类 viseme 按时间驱动，复核说话切换、字幕及听者反应帧；当前环境无法进行主观听感核查。
  motion_and_foley: >-
    压模准备、手指接触、模具落桌和孩子反应按动作节拍呈现；三次敲桌拟音位于 42.85、43.62、44.36 秒附近。口型与手势均为代码逐帧动画，而非静态图推拉。
  music_and_mix: >-
    原创配乐、同步 Foley、室内底噪和四段对白/旁白保留独立 WAV；最终成片峰值 -6.4 dBFS，音视频完整解码。当前环境不支持主观听审，已核对段落时码、声像和峰值。
  opening_middle_climax_ending: >-
    开场提出节日晚餐留下一个月余量的问题；中段从协作劳动转到“做得太多”；次月早餐用同一块月饼和木模三拍收尾，没有主题复述字幕。
