project: zhongqiu
title: 同一个节日，许多种动作
status: paused_by_user
deliverable: final.mp4
format: 1920x1080, 24 fps, stereo
target_duration_seconds: 270
status_reason: >-
  用户于 2026-09-29 要求暂停制作并直接推送 GitHub main 复盘。既有研究、creative plan 和中秋困难 POC 输入保留；尚未提交任何中秋生成任务或 POC 成片。恢复后先完成 GPT 歌曲及其 POC，再制作火龙真实连续动作与家庭分饼细节的中秋 POC。项目未完成。

creative_plan:
  audience_hook: >-
    先听见六枚骰子撞进瓷碗，再切到香港火龙穿过街巷、台湾烤炉的油响、苏州肉月饼裂开、灯笼穿过新加坡夜市、海外下班者切开一小块月饼。声音和动作彼此反差，提出“为什么这些看起来不同的事，都挤在同一个节日里？”
  why_watch: >-
    陌生观众能先得到一组具体、不同材质的动作，再逐渐理解节日怎样从天文日期进入地方街巷、家庭厨房、市场和移民生活；不是用节日符号清单解释百科。
  central_question: 同一个日期怎样留在历法里，却被不同地方和每一代人过成不同的动作？
  author_thesis: >-
    中秋持续不是因为每个家庭始终照着同一套古老脚本生活，而是人们不断把天文时间、秋季物候、家庭关系、食物、地方社群和现代城市生活重新接在一起。
  explanatory_layers:
    - 中秋按农历八月十五，靠近秋季满月；公历日期每年改变。历法日期不等于每年精确天文满月。
    - 讲清一项节日习俗如何通过真实身体、空间与声音完成，不用“传统上大家都会”代替观察。
    - 横向并置地方、家庭、迁移和世代差异；个案只说明个案。
  narrative_engine: 一枚从瓷碗弹出的骰子反复回到影片，声音从家庭桌面扩展到节庆街道、市场与新的家庭习惯。
  ending_logic: >-
    次日仍有人把剩下的月饼带进普通早餐；它不是遗留的节日摆设，而是这家人如何安排自己的中秋。收在“传统每一代都要重新练习”这一可见动作，不用共享月亮式祝词。
  visual_language: >-
    纸本水彩和手绘线条贯穿历史、厨房和街巷，但人物必须完成可读的准备、抬手、接触、结果、反应和余韵。镜头通过完整动作与表演建立连续性，不把人物作为静态贴纸；地方色彩来自真实材料，不靠月亮、兔子或灯笼填空。
  music_arc: >-
    原创木质打击、拨弦与少量低音建立脉冲；骰子与压模声构成节奏，火龙和人群打开空间；烤肉和市场段增加日常的速度；海外家庭段抽薄编制；结尾保留厨房环境声和一个木模余响。

research:
  as_of: 2026-09-28
  verified_facts:
    - 中秋日期按农历八月十五，公历日期每年变化；当日接近满月，但不保证与天文满月时刻完全重合。
    - 中秋作为节日逐渐形成。赏月在唐宋时期发展，宋代出现更普遍的城市节庆实践；学者对具体“形成朝代”的划分并不完全一致。
    - 香港天文台记录，中秋期间的天文满月常在农历十五或十六，也可能在十七；节日日期与精确满月时刻不是同一概念。
    - 关于“月饼”与中秋的关系需分开表述：宋代资料中的同名饼食未必已是固定节令食品；明代材料有较清楚的八月馈赠/供月记载。研究者对具体成为节令食品的时间仍有不同判断。
    - 香港大坑火龙舞由社区成员制作、搬运并在街巷中表演；年度规模数字会变动。
    - 闽南博饼以掷骰子决定会饼奖项；海外社群也把活动带入当地中秋聚会。常见历史起源故事属于地方传说。
    - 台湾中秋烤肉是近几十年普及的实践，广告、零售和户外休闲等因素均被报道，唯一创始时刻未被证实。
    - 苏州鲜肉月饼呈现现烤、季节性购买与传统/新馅并存；不能外推为各地月饼的共同做法。
    - 芝加哥移民长者口述记忆包括儿时灯笼、月饼、等月亮及在美国重建社区；这是受访者的个人记忆。
  source_opinions:
    - “中秋就是团圆节”是常见解释，但不等于每个人都有相同家庭经验。
    - 月饼何时成为中秋节令食品的学术解释仍有分歧；影片把“可见的文献证据”与“习俗最初出现”分开。
    - 关于节日形成的精确年份、烤肉风潮的单一源头、博饼的郑成功起源故事，分别属于有争议解释、简化叙事或地方传说。
  author_analysis: 节庆物件不是固定不变的象征；同一日期可以进入休闲、商业、家务、社区表演、迁移记忆和新家庭习惯。
  uncertainty:
    - 相关历史是长期演变，片中不使用“某年某人发明中秋”叙述。
    - 如果成片引用火龙人数、长度或香枝数量，必须注明所对应的年份和报道来源。
    - 不把一次家庭口述或一次地方活动推广成整个华人社群的习惯。

