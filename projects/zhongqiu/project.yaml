    portrayal: 依据社区/旅游报道的街巷实践重构，不生成历史档案。
  - id: taiwan_mid_autumn_bbq
    source: sources.md#地方习俗食物与现实经验
    purpose: 看一种现代习俗如何由广告、市场、休闲和家庭选择共同扩散。
    portrayal: 烤肉普及的具体路径存在多种解释，画面不指定唯一创始事件。
  - id: suzhou_fresh_meat_mooncake
