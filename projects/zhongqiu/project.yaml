language: Chinese Mandarin narration and captions

central_question: 同一个农历日期，为什么会被不同地方、家庭和年代过成不同的生活？
thesis: 传统持续不是因为每个人重复同一动作，而是同一个节日时间不断被地方、家庭和时代重新实践。

narrative:
  - 以骰子、火龙、烤肉、月饼和家庭分享等动作先提出问题。
  - 说明农历八月十五靠近秋天，但节日日期与天文学满月时刻不总相同。
  - 将节日形成写成跨越长时间的累积过程，不编单一发明日。
  - 用宋代饼食文献与更明确的明代中秋馈赠/供月记载呈现月饼证据边界。
  - 以厦门博饼、香港大坑火龙、台湾近代烤肉、苏州鲜肉月饼和海外家庭实践并置地方差异。
  - 回到一个家庭场景，指出公共节日时间不要求相同的私人意义。

visual_method:
  - ImageGen 水彩、纸本和墨线场景图；生成角色为匿名 composite，不复刻采访对象。
  - Blender 5.2.1 刚体模拟负责骰子落入瓷碗、碰撞和停稳这一真实运动镜头。
  - FFmpeg 为插画做克制的纸面镜头移动和模糊延展背景；不把静态人物平移冒充人物动作。
  - 重要日期、事实标签和中文字幕全部后期排版。

sound_method:
  - Microsoft System.Speech 离线普通话旁白。
  - Mixkit 免费许可的器乐曲作为低层音乐，并在结尾前淡出。
  - Freesound CC0 骰子、瓷器和酥皮 Foley；Mixkit 免费许可通用煎锅和街道脚步声。
  - 未使用来源不明的烧烤声和火龙鼓声，不伪造现场广播或受访者音频。

