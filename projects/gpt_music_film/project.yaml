shots:
  - id: full_song_motion_graphics
    section: Full song
    action: Eighteen animated illustrated-doc set pieces timed to the complete selected song.

story:
  logline: >-
    A person who loves using AI moves from delighted shortcuts to shifting model behavior, plentiful slop,
    code that can act, and the question of who actually approved the action.
  hook: "It was working yesterday."
  arc: [wonder, fluent_mistake, over_agreement, model_switch, output_flood, agent_boundary, human_review]
  tone: "Warm, self-aware, and wry about automation; never a joke at a real person's expense."
  lyric_source: assets/song_lyrics.txt
  research_source: sources.md
  historical_details_in_song: >-
    Case and product specifics are carried in visual notes and source labels; lyrics remain a singable personal
    story rather than a list of model names, years, or technical terms.

music:
  provider: ACE-Step 1.5 local model
  model: acestep-v15-turbo
  generation: "Local ACE-Step API; saved candidate task; no singer reference"
  license_note: "ACE-Step code/model are labeled MIT upstream; recheck source license and model-card terms before commercial release."
  selected_asset_id: it_was_working_candidate_a
  selected_file: assets/song_candidate_a.wav
  bpm_requested: 128
  bpm_detected: 129.2
  key_reported: G minor
  duration_seconds: 195.0
  lyric_sha256: a404c2c57e663e835be132cce53877d733e041f0e861b2b0ca54285955c18bfb
  alternate_asset_id: it_was_working_candidate_b
  selection:
    basis:
      - "Candidate A has a larger measured RMS chorus lift over Verse 1 (+2.05 dB; B +0.77 dB)."
      - "Candidate A has a larger measured final-chorus lift over Verse 1 (+3.50 dB; B +2.54 dB)."
      - "Mean chroma similarity between the first title-hook window and closing-hook window was 0.605 for A and 0.12 for B; this is a harmonic-color proxy, not a melody-quality score."
      - "A local large-v3-turbo transcript caught the final title hook and more of the ‘if this is progress’ line; B captured some other anchor phrases more clearly."
    listening: "Subjective playback was unavailable in this assistant runtime; an 8-second sample attempt returned audio-input unsupported. Selection is based on local signal and anchor-transcript evidence, not a claimed human audition."
    policy: "No full-song WER threshold, word-correction loop, or fourth full-song candidate."
  candidate_generation:
    candidate_a: "Generated; exact current lyric SHA-256; selected"
    candidate_b: "Generated; exact current lyric SHA-256; alternate"
    ace_step_service: "Not running at final edit time; existing generated files and metadata verified locally."
  analysis: song_candidate_review.json

visuals:
  method: >-
    Eighteen designed motion-graphic set pieces over cropped panels from two existing 2x2 ImageGen sheets. Pillow
    and FFmpeg animate reconstructed documents, model selection/routing, deprecation, sycophancy rollback,
    print-output flood, database/code-freeze status, a repository crossing a network boundary, role/log mismatch,
    the two distinct sandbox cases, verification questions, and an approval gate. Generated text in the source art
    is never treated as fact; meaningful wording is rebuilt in post.
  renderer: render_motion_graphics.py
  intermediate: assets/motion_graphics.mp4
  source_storyboards:
    - storyboards/early-wonder-and-slop.jpg
    - storyboards/selector-repo-permission.jpg
  treatment: "Illustrated documentary / office-paper editorial; no robot face, generated archive, or real-person likeness."
  phrase_overlays: assets/lyrics.ass
  timing: "Section and phrase timing follows candidate A's local transcript and measured ~129 BPM pulse; only the title, punchlines, and risk questions get short-anchor timing."
  shots:
    - small_ask
    - first_shortcuts
    - mata_docket
    - model_selector_fallback_deprecation
    - sycophancy_rollback
    - output_slop_flood
    - replit_production_database
    - early_grok_repository_boundary
    - claude_code_role_consent_report
    - robert_williams_false_lead
    - robert_williams_arrest_consequence
    - person_not_match_score
    - openai_huggingface_internal_test
    - verification_questions
    - agent_action_queue
    - human_boundary_stop
    - human_review_before_action
    - outro

sources:
  file: sources.md
  factual_boundaries:
    - "OpenAI/Hugging Face is an internal cyber-evaluation sandbox incident, not a public ChatGPT product jailbreak."
    - "Claude Code issue #44778 is one reported reproduction, not a universal user experience."
    - "Grok upload research is version-bounded to an early 0.2.93 client; it is not claimed as current behavior."
    - "Robert Williams and his family are not impersonated, caricatured, or used as a punchline."
    - "‘Nerfed’ and similar posts are anecdotal user language, not capacity or model-quality measurements."

production:
  pipeline: pipeline.py
  input_manifest: assets/edit_decision.json
  mix_manifest: assets/mix.json
  ffmpeg_workflow: "Render graphics → reviewed phrase overlays → selected song mix → 1080p/24 transcode → decode/audio/contact-sheet QA."
  soundtrack: "Selected generated song only; no archival speech or unverified vocals."
  pipeline_outputs:
    final_video: final.mp4
    contact_sheet: review.jpg
    qa_report: assets/final_qa.json
  git_delivery: "The 18,318,121-byte H.264 CRF 27 final.mp4, compact review.jpg and storyboard sheets are versioned; the original AAC soundtrack is copied intact, while the selected full-song WAV and working renders remain local and ignored."

