project: gpt_music_film
title: 从一句话到一项事
status: complete
deliverable: final.mp4
format: 1920x1080, 24 fps, stereo
target_duration_seconds: 105

creative_plan:
  audience_hook: >-
    黑场里听到一声按键；屏幕上只出现半句话，一个字一个字自行延长，直到光标所在的空白被文字占满。随后，人手缩回，而正在变化的文字开始安排桌上的实际工作物件。开头制造问题：谁在继续这项工作？
  central_question: >-
    GPT 的变化，是否只是回答越来越复杂，还是人把越来越完整的一段工作交给了它？
  author_thesis: >-
    这条历史最值得注意的关系变化，是人愿意提交的工作边界扩大：从生成一段文本，到理解上下文、跨模态回应、调用外部工具、延长推理，再到计算机界面上的多步操作与交付物。模型仍依赖人设定目标、软件/工具提供执行边界，以及人对结果的检查；改变的是人与执行过程之间的距离。
  why_watch: >-
    观众能在不认识 GPT 型号的情况下认出自己工作的变化：手先逐字输入，后来描述任务，最后检查一项由系统逐步推进的工作。音乐和视觉以这一只手的位置变化讲清技术史，不要求观众读一串模型名称。
  narrative_engine: >-
    画面从“单一续写通道”不断添加上下文、对话往返、图像/声音输入、工具接口与时长；每次媒介扩张，音乐都会多出一个互相呼应的声部。一次静默将累积压力打断，最后同样的开场音型以多声部完成，并让人手重新承担审核/选择。
  cases_or_subjects:
    - subject: 以官方发布中确实示范的任务为基础，做三个明确标注的复合用户/开发者情境。
      cases:
        - 用户让对话模型协助修改代码，来自 ChatGPT 发布示例。
        - 开发者把天气查询/邮件编写任务连接到函数接口，来自 OpenAI function calling 公告示例。
        - 用户把图片、语音、长任务和电脑操作放进流程，来自 GPT-4o、GPT-5、GPT-5.4 与 GPT-6 官方能力说明。
      evidence_boundary: 这些是将官方演示转为视觉叙事的创作综合场景，不声称是代表性用户调查，也不伪装真实用户录像。
  structure:
    - section: 单声部预测（0–14 秒）
      purpose: 一道输入、一个续写，文字像可听见的单音不断延长；听者尚未交出完整任务。
    - section: 上下文变成例子（14–28 秒）
      purpose: 示例进入文本窗口后，单线开始分叉；编码/文本任务由提示上下文触发，不用“参数暴涨”可视化。
    - section: 对话循环（28–42 秒）
      purpose: 人可以追问、纠正、要求重写；画面由排版行变成两方向节奏。
    - section: 感知进入工作面（42–57 秒）
      purpose: 图像、语音和文字作为同一场景中的不同输入共同参与，不以机器人/发光大脑代表多模态。
    - section: 连接工具（57–70 秒）
      purpose: 语言被转换成有边界的函数请求；应用执行工具、系统回传结果，显示接口关系而非魔法自主。
    - section: 留出推理时间（70–83 秒）
      purpose: 打断已经加速的音乐，让等待、内部重组与检查变成可感时间；不把隐藏思维链画成真实窥视。
    - section: 多步工作与审核（83–105 秒）
      purpose: 文本/图片/浏览/代码元素构成持续任务，最终生成一个可用交付物；人重新进入画面检查一处、决定接受或改写。
  turning_points:
    - 续写从局部文字延伸成可由上下文控制的任务。
    - 一个回合变成可以纠正、继续和比较的对话。
    - 外部工具接口让文字输出离开聊天框，但执行仍由应用环境接手。
    - 推理需要等待；长期任务需要持续执行。
    - 最终变化落在人的工作动作：逐字输入变成目标设定与交付检查。
  climax_hypothesis: >-
    音乐密度叠满时，一连串任务产生实际文档/可运行结果；突然抽空后，人手回来检查其中一项并决定修改，表明“能完成工作”与“由谁负责结果”不是同一件事。
  ending_logic: >-
    回到片头同一个光标和敲击音，但现在文字之外还有完成的对象。人把其中一行改掉，音乐留下可辨认的开头音型。结尾落在选择而非“AI 取代人”或“AI 只是工具”的口号。
  visual_language: >-
    以纸、屏幕、工作台和手作为真实视觉主体；原生矢量动画把字符变成线段/连接器，把 UI 变成抽象但可读的界面边界，现实物品逐渐参与。文字只负责精准短节点日期和节点名，音乐和对象承担主要信息。材料变化来自关系与密度，不是蓝色科技装饰。
  motion_strategy: >-
    构建一段连续的 105 秒画面运动：开头只有字符沿基线生成；上下文段字符回返组成配对；对话段两股流互相改写；多模态段图形波/图像窗进入同一轨迹；工具段连线穿过清楚可见的应用边界后出现动作结果；推理段暂停并重新排列；代理段由一个目标发散为数条有回执的步骤，最终由人手确认。主要动效和节拍由代码生成；图片是构成运动的输入，不以截图拼贴做 PPT。
  sound_world:
    dialogue: 无口述旁白；人声不作为科技氛围贴片。
    sync_foley: 开场按键、笔划/纸张、光标落点、工具动作提示、打印/生成输出、人工删改和确认声。
    ambience: 很轻的工作室房间音，随画面从桌面扩到电脑环境逐渐拉开声场。
    event_sound: function request 与应用响应使用两个不同声源，明确输入/执行/回执边界；拒绝模拟特定产品真实提示音。
    music: 完全原创节奏/和声由一音扩展至多声部再重组，不使用俗套合成器 arpeggio 或科技片音效包。
  music_arc: >-
    约 96 BPM 的单音木质/钢琴式脉冲开始；每章分别加入低音、反拍、成对音、第二个音域和稀疏弦片。多模态和工具段的节奏开始互相回应；靠近高潮时密度增加但留出反拍的空隙；o1/reasoning 转折将低频和节拍突然抽空三拍；最后一章以逐渐合并、音高和声改变、节拍稳定的方式重建开头音型，最后把一个声音让给真实的手写/编辑 Foley。
  material_strategy:
    generate: 纸和屏幕质感、桌面实物与手的生成素材作为视觉起点；不生成产品 UI 截图、logo 或仿真聊天记录。
    build_by_code: 字符、连接器、节拍运动、界面边界、工作对象位移、任务节点、排版与音画同步均由原生动态图形完成。
    real_sources: 仅引用 OpenAI 官方一手材料确认 GPT 节点；产品展示转成中性的重构画面，不当作真实用户访谈。
  anti_cliches:
    - 不依次展示 GPT-1 到 GPT-6 产品卡片/参数表。
    - 不用发光脑、蓝色电路、机器人脸、漂浮代码或赛博城市。
    - 不说“GPT 越来越聪明”来代替关系分析。
    - 不把 function call 描绘成模型本身已经执行一切；保留应用/权限/返回结果边界。
    - 不把产品示范案例当成所有用户的实际体验。
    - 不把文本排成满屏说明卡；字应该参与音乐和画面结构。
  risks:
    - 如果音乐先成背景而非时间结构，片子会退化成年度产品回顾；各章节时长以音乐变化和动作决定。
    - 视觉密度提高可能只表示装饰越来越多；每层必须新增一种人与任务之间的关系。
    - 当前官方资料有营销性质；成片避免复述“最强/专家”等宣传评价。
    - 细小 UI 容易诱发不可读文字/仿冒产品；把它抽象成可读关系图而非仿造真实产品界面。
  why_watch_test:
    label_removed: >-
      它仍能讲清人从手工操作一个句子，到把多步工作交给另一套系统的行为变化；视觉关系和音乐弧线自身成立。
    likely_30_second_exit: 如果只滚动年份和软件截图、或前 30 秒没有可见的人/任务动作，观众会把它当发布会合集。
    cliché_risk: “越大、越聪明、越未来”；用交接距离、工作边界和回执代替。
    climax_test: 高点是目标化成工作成果而人重新进入审核，不是粒子爆炸或最大编制。
    ending_test: 结尾引出人依旧负责筛选/修订的具体动作，不重述整条时间线。
  replanning_rule: >-
    完成约三分之一核心音乐和动态图形后暂停；重新听音乐、移除标签测试、不读说明重看画面。如果关掉官方节点文字之后发展关系不清，或某一章节仅靠节拍硬接不相干画面，就重新定结构而不是增加科技素材。

research:
  as_of: 2026-09-28
  fact_scope: 2018 年 GPT 风格的无监督语言预训练到 2026 年 GPT-6 Astra 的公开节点。
  verified_facts:
    - {source: OpenAI 2018, fact: 大规模无监督语言预训练与下游任务迁移。}
    - {source: OpenAI 2020 GPT-3 paper, fact: 1750 亿参数与 in-context few-shot 学习表现。}
    - {source: OpenAI ChatGPT 2022, fact: 对话式交互与 RLHF 训练流程。}
    - {source: OpenAI 2023 GPT-4, fact: 图像/文本输入生成文本；当时视觉输入仍为研究预览。}
    - {source: OpenAI function calling 2023, fact: 模型生成结构化函数参数，应用接入外部工具。}
    - {source: OpenAI GPT-4o 2024, fact: 官方提出文字、音频、图像、视频输入及文字、音频、图像输出的统一多模态方向；上线能力分阶段。}
    - {source: OpenAI o1 2024, fact: 强化学习及测试时计算令推理等待时间成为模型输出的一部分。}
    - {source: OpenAI GPT-5 2025, fact: 快速/深度推理的统一系统与实时路由。}
    - {source: OpenAI GPT-5.4 2026, fact: 原生计算机使用能力进入通用模型的公开发布说明。}
    - {source: OpenAI GPT-6 Astra 2026-09, fact: 发布方称其面向计算机使用和复杂多步工作，并可产出文件型交付物。}
  source_opinions: 官方“最强、最聪明、专业级”等表述不进入创作论点；官方用户演示不视作独立的用户研究。
  author_analysis: >-
    影片沿着人的委托边界推进：句子续写 -> 任务上下文 -> 对话回路 -> 多模态感知 -> 工具调用 -> 思考时长 -> 计算机工作流与可审阅交付物。
  uncertainty: 公开产品宣传无法证明所有真实用户按此路径使用；本片使用演示案例的复合重构，不做普遍化结论。

cases:
  - id: task-delegation-composites
    source: sources.md#节点与来源
    portrayal: clearly illustrative, built from documented product examples; not user footage
    subject: a human hand and changing work objects, no identifiable person

structure:
  chapter_cues:
    - {section: 0–14, movement: one stream produces one continuation, music: one note and quiet key attack}
    - {section: 14–28, movement: examples change what fits in context, music: paired motifs}
    - {section: 28–42, movement: dialogue allows correction and return, music: call and response}
    - {section: 42–57, movement: text shares the page with images, sound and structured actions, music: wider register and independent pulses}
    - {section: 57–70, movement: a request crosses into a tool and a result comes back, music: pulse splits across boundary}
    - {section: 70–83, movement: waiting becomes part of the work, music: sudden silence then slow rebuild}
    - {section: 83–105, movement: several steps create an object for a human to review, music: layered resolution with a human edit}
  shot_count_target: 12

motion:
  body_action: cursor types then withdraws; finger toggles context; hand passes an image/input token; connector crosses a software boundary; cursor waits; human inspects output and edits one part.
  visual_changes: text density, number of interacting agents, work object count, and distance from hand to action change only when supported by researched development node.
  continuity: preserve a small opening sound/visual token through the whole film so that the end differs but remains recognizably related.

sound:
  stems: [music, sync_foley, ambience, interface_events]
  dialogue: none
  audio_source: original synthetic instruments and purpose-created Foley; no real product sound or copyrighted music

music:
  composition: original piece composed before the shot sequence; part of the narrative, not underscoring
  cue_points_seconds: {predict: 0, context: 14, dialogue: 28, multimodal: 42, tools: 57, reasoning_silence: 70, multi_step: 83, human_review: 100, stop: 105}
  motifs: [one-note prompt, paired example, reply interval, polyphonic context, pause for reasoning, returned note for review]
  candidate_review: >-
    另生成 108 BPM 替代稿，与成片 96 BPM 版按七段比较包络 RMS：96 BPM 为 -28.5/-23.9/-22.4/-22.4/-22.4/-79.9/-21.4 dB，108 BPM 为 -27.9/-23.4/-21.9/-21.7/-21.8/-77.8/-20.8 dB。选 96 BPM 版保持层次增密与任务段的张力余地；两版都保留 70–83 秒抽空段，较快版本持续能量稍高。只比较结构与包络，不声称完成主观听审。

prompts:
  material_still: "Close observational still life on a used work table: one human hand beside plain paper, a mechanical keyboard, a small printed image, and a blank screen with no visible interface; soft directional daylight, tactile paper grain, restrained natural colors, no sci-fi styling, no logo, no legible text, wide 16:9."
  avoid_visuals: [glowing brain, humanoid robot, blue circuitry, cyberpunk city, floating code, brand interface screenshot]

selected:
  - asset: assets/worktable-side.png
    role: opening image and retreating-hand motif
    reason: >-
      The hand leaving the keyboard, blank screen and large clear area create an immediate unanswered question and room for motion graphics.
  - asset: assets/worktable-overhead.png
    role: later return to human review
    reason: >-
      The overhead view puts handwriting, screen and image in one continuous work surface, allowing the task boundary to widen without product screenshots.
rejected_reasons: []
material_review_replan: >-
  首轮生成约三分之一画面与音乐后暂停复看：年份标签和独立圆角 GUI 卡片让片子接近产品发布会/信息图合集。于是移除年份标题及卡片画面，不再补第三张科技图；把文本、图像、等待和工具返回都放回同一张桌面与真实屏幕里，以手、纸、键盘和可见动作承担转折。最终复看确认视觉不依赖年份字幕推进；信息图只在屏幕内容确有帮助时短暂出现，音乐的抽空和重组支撑中段转折。
qa:
  viewing_status: >-
    已复核 5 秒接触表及 2、17、34、48、63、73、83、93、102 秒结构帧；成片全长解码无错误。
  official_fact_scope: >-
    研究节点均可回溯到 sources.md 所列 OpenAI 一手资料；年份/产品名称只作研究索引，不组成画面标题时间线。官方能力自述与作者的“委托边界”分析已分开记录。
  music_arc_without_labels: >-
    无章节名或日期字幕时，音乐从单音重复、成对回应、多层进入，至 70 秒抽空，再以分层和声返回，末段留下人工修订；结构由声部和动作推动。
  interface_boundaries: >-
    画面显示输入、上下文、图像进入、工具调用/返回与交付物；工具执行通过界面路径表现，没有暗示模型脱离应用、权限或执行环境独自完成。
  motion_and_synchronicity: >-
    字符、光标、图形线段及手部画面按乐段变换；抽空处减少屏幕元素，返回处重建关系。素材以静态生成场景加代码动画为主，不伪称连续真人影像。
  distinct_form_from_other_films: >-
    无旁白的音乐驱动桌面影像，与中秋人物对白动画及国庆观察性单案例重构在声音、剪辑和视觉语法上均不同。
  opening_middle_climax_ending: >-
    先给一只手离开屏幕和未完成的任务；中段由多模态/工具调用进入静默等待；高点是可审阅的多步成果，最后由人动笔修订，不以“AI 更聪明”总结。
